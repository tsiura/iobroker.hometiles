# Lint, build and test only. There is deliberately no publish step yet: v0.1
# has never run on hardware, so nothing here should be able to push a release
# without a human deciding to.
name: Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # The opt-in integration suite (test/main.integration.test.ts): a real
  # js-controller, the packed adapter and iobroker.history, installed from npm
  # during the run, on the runner's own TMPDIR. It needs the network, no secrets.
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          HOMETILES_INTEGRATION: '1'
